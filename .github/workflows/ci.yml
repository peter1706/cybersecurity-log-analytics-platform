name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java (required by pyspark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dev tooling
        run: python -m pip install -r requirements.txt

      - name: Install Airflow (DAG structural unit tests)
        run: |
          python -m pip install "apache-airflow==3.3.0" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.0/constraints-3.11.txt"
          python -m pip install "apache-airflow-providers-docker==4.5.7"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow-home
        run: pytest -m "not e2e and not e2e_full"

  e2e:
    name: End-to-end (compose)
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install e2e test deps
        run: python -m pip install pytest boto3 pyarrow cryptography

      - name: Create .env
        run: |
          cp .env.example .env
          # Grant the Airflow containers access to the host Docker socket
          # (owned by the non-root `docker` group on Linux runners).
          sed -i "s|^DOCKER_GID=.*|DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)|" .env

      - name: Initialize container secrets
        # Credentials are file-based Docker secrets (never env vars); generate
        # them into ./secrets before compose reads them.
        run: bash scripts/init_secrets.sh

      - name: Validate compose config
        run: docker compose config >/dev/null

      - name: Run pipeline end-to-end (day 0)
        run: make pipeline

      - name: Verify Gold output
        run: pytest tests/e2e -m e2e

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 400

      - name: Tear down
        if: always()
        run: docker compose down -v
