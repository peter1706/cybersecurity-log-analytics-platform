name: Publish images

# Builds every custom image (airflow, lanl-simulator, spark-processor, delivery,
# ml-mock) and publishes it to GHCR. Runs only on push to `main` (post-merge) and
# on release tags -- never on pull_request, so forked/untrusted PRs can't push
# packages under this repo's namespace.
#
# Tagging scheme (immutable, no `:latest`):
#   - every push to `main`      -> sha-<short-git-sha>
#   - every `vX.Y[.Z][-pre]` tag -> the tag name itself, verbatim
#
# Local development is unaffected: `make build` / `docker compose build` still
# builds these same Dockerfiles locally and is not affected by this workflow.
on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clap-airflow
            dockerfile: airflow/Dockerfile
          - name: clap-lanl-simulator
            dockerfile: services/lanl-simulator/Dockerfile
          - name: clap-spark-processor
            dockerfile: services/spark-processor/Dockerfile
          - name: clap-delivery
            dockerfile: services/delivery/Dockerfile
          - name: clap-ml-mock
            dockerfile: services/ml-mock/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      # Every custom image is built from the repo root (so it can COPY the
      # shared catalog/ package) -- see the `build.context: .` entries in
      # docker-compose.yml.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
