# Environment keys for daily_pipeline. Values are read from the Airflow
# container environment (injected via docker-compose from .env). Missing or
# empty keys fail at DAG parse time — there are no in-code defaults.
docker:
  img_simulator: IMG_SIMULATOR
  img_spark: IMG_SPARK
  img_delivery: IMG_DELIVERY
  img_ml_mock: IMG_ML_MOCK
  # Data plane network for the producer/Spark/delivery tasks; ml_consume runs on
  # the isolated consumer network instead.
  network_name: PIPELINE_NETWORK_NAME
  ml_network_name: ML_NETWORK_NAME
  host_project_dir: HOST_PROJECT_DIR

# Forwarded into every task container (simulator + spark-processor + delivery + ml-mock).
# Non-sensitive config only: credentials (MinIO keys, delivery key, catalog
# password) are delivered as mounted /run/secrets/<name> files, not env vars.
task_environment:
  - MINIO_ENDPOINT
  - LANDING_BUCKET
  - BRONZE_BUCKET
  - SILVER_BUCKET
  - GOLD_BUCKET
  - DELIVERED_BUCKET
  - ROLLING_WINDOW_DAYS
  - SCHEMA_VERSION
  - SPARK_DRIVER_MEMORY
  - SPARK_SQL_SHUFFLE_PARTITIONS
  - CATALOG_DB_HOST
  - CATALOG_DB_PORT
  - CATALOG_DB_NAME
  - CATALOG_DB_USER
