# Environment keys for daily_pipeline. Values are read from the Airflow
# container environment (injected via docker-compose from .env). Missing or
# empty keys fail at DAG parse time — there are no in-code defaults.
docker:
  img_simulator: IMG_SIMULATOR
  img_spark: IMG_SPARK
  network_name: NETWORK_NAME
  host_project_dir: HOST_PROJECT_DIR

# Forwarded into every task container (simulator + spark-processor).
task_environment:
  - MINIO_ENDPOINT
  - MINIO_ROOT_USER
  - MINIO_ROOT_PASSWORD
  - LANDING_BUCKET
  - BRONZE_BUCKET
  - SILVER_BUCKET
  - GOLD_BUCKET
