# Local platform: MinIO + Airflow 3.3 (LocalExecutor) + Spark/Delta + governance
# catalog, split across three isolated Docker networks (see the `networks:` block
# at the bottom) and with all credentials delivered as container secrets mounted
# at /run/secrets/<name> (see the `secrets:` block).

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: clap-airflow:dev
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Credentials come from mounted secrets, not the environment: Airflow reads the
    # *_CMD variants at runtime (the DB URL embeds the password read from its file).
    # Airflow runs a *_CMD without a shell (it splits the string and execs it) and
    # does not strip the output, so the DB URL must be produced by an explicit
    # `bash -c` (for the `$(cat ...)` substitution) using `printf` (no trailing
    # newline). A bare `echo "...$(cat ...)..."` would be sent verbatim.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: 'bash -c "printf postgresql+psycopg2://${AIRFLOW_DB_USER}:%s@airflow-postgres:5432/${AIRFLOW_DB} $$(cat /run/secrets/airflow_db_password)"'
    AIRFLOW__CORE__FERNET_KEY_CMD: "cat /run/secrets/airflow_fernet_key"
    AIRFLOW__API_AUTH__JWT_SECRET_CMD: "cat /run/secrets/airflow_jwt_secret"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Airflow 3: workers talk to the API server (not the metadata DB directly).
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    # Simple Auth Manager (admin password read from its secret at init time).
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json.generated
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
    # Wiring the DAG uses to launch task containers.
    IMG_SIMULATOR: ${IMG_SIMULATOR}
    IMG_SPARK: ${IMG_SPARK}
    IMG_DELIVERY: ${IMG_DELIVERY}
    IMG_ML_MOCK: ${IMG_ML_MOCK}
    PIPELINE_NETWORK_NAME: ${PIPELINE_NETWORK_NAME}
    ML_NETWORK_NAME: ${ML_NETWORK_NAME}
    HOST_PROJECT_DIR: ${HOST_PROJECT_DIR}
    MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    LANDING_BUCKET: ${LANDING_BUCKET}
    BRONZE_BUCKET: ${BRONZE_BUCKET}
    SILVER_BUCKET: ${SILVER_BUCKET}
    GOLD_BUCKET: ${GOLD_BUCKET}
    DELIVERED_BUCKET: ${DELIVERED_BUCKET}
    ROLLING_WINDOW_DAYS: ${ROLLING_WINDOW_DAYS:-7}
    SCHEMA_VERSION: ${SCHEMA_VERSION:-v1}
    # Spark tuning, forwarded by the DAG into every spark-processor task.
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}
    SPARK_SQL_SHUFFLE_PARTITIONS: ${SPARK_SQL_SHUFFLE_PARTITIONS:-8}
    # Governance catalog (postgres-catalog): non-sensitive connection settings.
    # The password is read from /run/secrets/postgres_catalog_password by the
    # DAG's job-run callbacks (read_secret) -- not forwarded as an env var.
    CATALOG_DB_HOST: ${CATALOG_DB_HOST}
    CATALOG_DB_PORT: ${CATALOG_DB_PORT}
    CATALOG_DB_NAME: ${CATALOG_DB_NAME}
    CATALOG_DB_USER: ${CATALOG_DB_USER}
    # Make the image-baked `catalog/` governance client importable by the DAG's
    # job-run callbacks (it lives outside the bind-mounted dags/ dir).
    PYTHONPATH: /opt/airflow/governance
  # Airflow needs its own metadata DB + API server (airflow-net) and, for the
  # job-run callbacks, the governance catalog + Docker socket (pipeline-net).
  secrets:
    - airflow_db_password
    - airflow_fernet_key
    - airflow_jwt_secret
    - airflow_admin_password
    - postgres_catalog_password
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - airflow-simple-auth:/opt/airflow/auth
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID}:0"
  group_add:
    - "${DOCKER_GID}"
  networks:
    - airflow-net
    - pipeline-net

services:
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      # MinIO reads the root credentials from the mounted secret files.
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    ports:
      - "9000:9000"   # S3 API (kept exposed for local debugging)
      - "9001:9001"   # console (debugging only)
    volumes:
      - minio-data:/data
    # On pipeline-net for the producers/Spark/delivery + on ml-net so the
    # consumer can reach only the delivered bucket (via a scoped service account).
    networks:
      - pipeline-net
      - ml-net

  # One-shot: wait for MinIO, create the layer buckets, and provision the
  # `delivered`-scoped MinIO service account the consumer uses, then exit.
  mc-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      LANDING_BUCKET: ${LANDING_BUCKET}
      BRONZE_BUCKET: ${BRONZE_BUCKET}
      SILVER_BUCKET: ${SILVER_BUCKET}
      GOLD_BUCKET: ${GOLD_BUCKET}
      DELIVERED_BUCKET: ${DELIVERED_BUCKET}
    secrets:
      - minio_root_user
      - minio_root_password
      - minio_ml_consumer_key
      - minio_ml_consumer_secret
    entrypoint: >
      /bin/sh -c '
      RU=$$(cat /run/secrets/minio_root_user);
      RP=$$(cat /run/secrets/minio_root_password);
      CK=$$(cat /run/secrets/minio_ml_consumer_key);
      CS=$$(cat /run/secrets/minio_ml_consumer_secret);
      until mc alias set local $$MINIO_ENDPOINT "$$RU" "$$RP"; do
        echo "waiting for minio..."; sleep 2;
      done &&
      mc mb --ignore-existing local/$$LANDING_BUCKET &&
      mc mb --ignore-existing local/$$BRONZE_BUCKET &&
      mc mb --ignore-existing local/$$SILVER_BUCKET &&
      mc mb --ignore-existing local/$$GOLD_BUCKET &&
      mc mb --ignore-existing local/$$DELIVERED_BUCKET &&
      printf "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:GetBucketLocation\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::%s\",\"arn:aws:s3:::%s/*\"]}]}" "$$DELIVERED_BUCKET" "$$DELIVERED_BUCKET" > /tmp/ml-consumer.json &&
      mc admin user svcacct add --access-key "$$CK" --secret-key "$$CS" --policy /tmp/ml-consumer.json local "$$RU" || echo "ml-consumer service account already exists" &&
      echo "buckets + delivered-scoped ml-consumer account ready";
      '
    networks:
      - pipeline-net

  # Governance catalog: lineage, schema registry, job-run logs, checksums, and
  # delivery manifests. A separate instance from airflow-postgres so orchestration
  # state never mixes with governance data. On pipeline-net: the producers/Spark/
  # delivery task containers and the Airflow callbacks record here, but the ML
  # consumer (ml-net) never can.
  postgres-catalog:
    image: postgres:15
    environment:
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_catalog_password
      POSTGRES_DB: ${CATALOG_DB_NAME}
    secrets:
      - postgres_catalog_password
    volumes:
      - postgres-catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${CATALOG_DB_USER}", "-d", "${CATALOG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pipeline-net

  # One-shot: wait for the catalog, apply every migration in filename order, exit.
  # Migrations are idempotent (CREATE ... IF NOT EXISTS), so re-running is safe.
  catalog-migrate:
    image: postgres:15
    depends_on:
      postgres-catalog:
        condition: service_healthy
    environment:
      CATALOG_DB_USER: ${CATALOG_DB_USER}
      CATALOG_DB_NAME: ${CATALOG_DB_NAME}
    secrets:
      - postgres_catalog_password
    volumes:
      - ./catalog/migrations:/migrations:ro
    entrypoint: >
      /bin/bash -c "
      set -e;
      export PGPASSWORD=$$(cat /run/secrets/postgres_catalog_password);
      for f in $$(ls /migrations/*.sql | sort); do
        echo \"applying $$f\";
        psql -v ON_ERROR_STOP=1 -h postgres-catalog -U $$CATALOG_DB_USER -d $$CATALOG_DB_NAME -f \"$$f\";
      done;
      echo 'catalog migrations applied';
      "
    networks:
      - pipeline-net

  airflow-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/airflow_db_password
      POSTGRES_DB: ${AIRFLOW_DB}
    secrets:
      - airflow_db_password
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - airflow-net

  airflow-init:
    <<: *airflow-common
    depends_on:
      airflow-postgres:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
      mkdir -p /opt/airflow/auth &&
      airflow db migrate &&
      python -c \"import json,os; p='/opt/airflow/auth/simple_auth_manager_passwords.json.generated'; pw=open('/run/secrets/airflow_admin_password').read().strip(); open(p,'w').write(json.dumps({os.environ['AIRFLOW_ADMIN_USER']: pw}))\" &&
      echo 'simple auth password file ready'
      "
    restart: on-failure

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    restart: unless-stopped

  # --- Task images (built, not run as services). Launched by the DAG. ---
  # Built from the repo root so each image can COPY the shared catalog/ client.
  lanl-simulator:
    build:
      context: .
      dockerfile: services/lanl-simulator/Dockerfile
    image: ${IMG_SIMULATOR}
    profiles: ["build"]

  spark-processor:
    build:
      context: .
      dockerfile: services/spark-processor/Dockerfile
    image: ${IMG_SPARK}
    profiles: ["build"]

  delivery:
    build:
      context: .
      dockerfile: services/delivery/Dockerfile
    image: ${IMG_DELIVERY}
    profiles: ["build"]

  # Always-on consumer dashboard (the only new long-running service). Its build
  # also produces the ml-mock image the `ml_consume` DAG task launches. On ml-net
  # only, using the `delivered`-scoped MinIO service account -- it can reach the
  # delivered bucket and nothing else (no catalog, no other layers).
  ml-dashboard:
    build:
      context: .
      dockerfile: services/ml-mock/Dockerfile
    image: ${IMG_ML_MOCK}
    entrypoint:
      - streamlit
      - run
      - /app/dashboard.py
      - --server.port=8501
      - --server.address=0.0.0.0
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      DELIVERED_BUCKET: ${DELIVERED_BUCKET}
    secrets:
      - minio_ml_consumer_key
      - minio_ml_consumer_secret
      - delivery_encryption_key
    ports:
      - "${ML_DASHBOARD_PORT:-8501}:8501"
    depends_on:
      - minio
    networks:
      - ml-net
    restart: unless-stopped

volumes:
  minio-data:
  airflow-postgres-data:
  postgres-catalog-data:
  airflow-logs:
  airflow-simple-auth:

# All credentials are file-based Docker secrets, mounted at /run/secrets/<name>.
# Populate ./secrets with scripts/init_secrets.sh (gitignored; never committed).
secrets:
  minio_root_user:
    file: ./secrets/minio_root_user
  minio_root_password:
    file: ./secrets/minio_root_password
  minio_ml_consumer_key:
    file: ./secrets/minio_ml_consumer_key
  minio_ml_consumer_secret:
    file: ./secrets/minio_ml_consumer_secret
  postgres_catalog_password:
    file: ./secrets/postgres_catalog_password
  airflow_db_password:
    file: ./secrets/airflow_db_password
  airflow_fernet_key:
    file: ./secrets/airflow_fernet_key
  airflow_jwt_secret:
    file: ./secrets/airflow_jwt_secret
  airflow_admin_password:
    file: ./secrets/airflow_admin_password
  delivery_encryption_key:
    file: ./secrets/delivery_encryption_key

# Three isolated networks (least privilege by construction):
#   pipeline-net  data plane: MinIO, postgres-catalog, and the producer/Spark/
#                 delivery task containers + Airflow (for callbacks + socket).
#   airflow-net   orchestration control plane: airflow-postgres + Airflow services.
#   ml-net        consumer plane: MinIO (delivered bucket only) + ml-mock.
# The catalog shares pipeline-net (rather than its own network) because a
# DockerOperator task container attaches to a single network yet needs both the
# object store and the governance catalog; the ML consumer stays fully isolated
# from the catalog on ml-net.
networks:
  pipeline-net:
    name: ${PIPELINE_NETWORK_NAME:-clap-pipeline-net}
  airflow-net:
    name: ${AIRFLOW_NETWORK_NAME:-clap-airflow-net}
  ml-net:
    name: ${ML_NETWORK_NAME:-clap-ml-net}
